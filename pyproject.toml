[project]
name = "analytic-system"
version = "0.1.0"
description = "Analytic System for online shop"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "1R0N3k" }]

dependencies = [
    "django>=6.0.7",
    "dotenv>=0.9.9",
    "email-validator>=2.3.0",
    "faker>=40.36.0",
    "kaleido>=1.3.0",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "streamlit>=1.59.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py314"
include = ["*.py", "*.pyi"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
    "manage.py",
]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",  
]
ignore = [
    "E501",
    "B008",
    "RET504",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "dashboard"]
known-third-party = ["django", "streamlit", "plotly", "pandas", "requests"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"apps/*/migrations/*.py" = ["E501", "F401"]
"apps/*/admin.py" = ["F401"]
"apps/*/apps.py" = ["F401"]
"__init__.py" = ["F401"]