[project]
name = "analytic-system"
version = "0.1.0"
description = "Analytic System for online shop"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "1R0N3k" }]

dependencies = [
    "django>=6.0.7",
    "dotenv>=0.9.9",
    "email-validator>=2.3.0",
    "faker>=40.36.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
]

[tool.uv.workspace]
members = ["dashboard"]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "djangorestframework-stubs>=3.18.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py314"
include = ["*.py", "*.pyi"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
    "manage.py",
]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",  
]
ignore = [
    "E501",
    "B008",
    "RET504",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "dashboard"]
known-third-party = ["django", "streamlit", "plotly", "pandas", "requests", "streamlit_autorefresh"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"apps/*/migrations/*.py" = ["E501", "F401"]
"apps/*/admin.py" = ["F401"]
"apps/*/apps.py" = ["F401"]
"__init__.py" = ["F401"]
"dashboard/**/*.py" = [
    "E501",
]
"dashboard/pages/*.py" = [
    "F401",
]
"dashboard/app.py" = [
    "E402",
]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]

namespace_packages = true
explicit_package_bases = true
mypy_path = ["."]

exclude = [
    "migrations/",
    "manage.py",
    ".venv/",
    "venv/",
    "__pycache__/",
]

[tool.django-stubs]
django_settings_module = "config.settings"

[[tool.mypy.overrides]]
module = "apps.*"
disable_error_code = ["attr-defined", "import-not-found", "name-defined"]

[[tool.mypy.overrides]]
module = ["dashboard.pages.*", "plotly.*", "streamlit_autorefresh.*", "pandas.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = "dashboard.services.*"
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "dashboard.*"
disable_error_code = ["import-not-found"]

[[tool.mypy.overrides]]
module = ["conftest", "dashboard.tests.*"]
ignore_errors = true
